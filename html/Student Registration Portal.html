<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
</head>

<body>

    <h1 align="center">Student Registration Portal</h1>

    <form>

        <table border="1" align="center" cellpadding="10">

            <tr>
                <td><label for="name">Full Name:</label></td>
                <td>
                    <input type="text" id="name" name="name" required>
                </td>
            </tr>

            <tr>
                <td><label for="email">Email:</label></td>
                <td>
                    <input type="email" id="email" name="email" required>
                </td>
            </tr>

            <tr>
                <td><label for="phone">Phone Number:</label></td>
                <td>
                    <input type="tel" id="phone" name="phone">
                </td>
            </tr>

            <tr>
                <td><label for="dob">Date of Birth:</label></td>
                <td>
                    <input type="date" id="dob" name="dob">
                </td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" id="male" name="gender" value="Male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                </td>
            </tr>

            <tr>
                <td>Courses:</td>
                <td>
                    <input type="checkbox" id="web" name="course" value="Web Development">
                    <label for="web">Web Development</label><br>

                    <input type="checkbox" id="python" name="course" value="Python">
                    <label for="C++">C++ Programming</label><br>

                    <input type="checkbox" id="graphic" name="course" value="Graphic Design">
                    <label for="graphic">Graphic Design</label>
                </td>
            </tr>

            <tr>
                <td><label for="city">City:</label></td>
                <td>
                    <select id="city" name="city">
                        <option value="">Select City</option>
                        <option value="Islamabad">Islamabad</option>
                        <option value="Lahore">Lahore</option>
                        <option value="Karachi">Karachi</option>
                        <option value="Peshawar">Peshawar</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label for="address">Address:</label></td>
                <td>
                    <textarea id="address" name="address" rows="4" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
