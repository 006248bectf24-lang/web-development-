<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Portal</title>
</head>

<body>

    <h1 align="center">Job Application Portal</h1>

    <form>

        <h2>Applicant Information</h2>

        <table border="1" cellpadding="10">

            <tr>
                <td><label for="name">Full Name:</label></td>
                <td><input type="text" id="name" name="name"></td>
            </tr>

            <tr>
                <td><label for="email">Email:</label></td>
                <td><input type="email" id="email" name="email"></td>
            </tr>

            <tr>
                <td><label for="phone">Phone Number:</label></td>
                <td><input type="tel" id="phone" name="phone"></td>
            </tr>

            <tr>
                <td><label for="address">Address:</label></td>
                <td>
                    <textarea id="address" rows="4" cols="30"></textarea>
                </td>
            </tr>

        </table>


        <h2>Education Details</h2>

        <table border="1" cellpadding="10">

            <tr>
                <th>Degree</th>
                <th>Institute</th>
                <th>Year</th>
                <th>Grade</th>
            </tr>

            <tr>
                <td>Matric</td>
                <td>ABC School</td>
                <td>2020</td>
                <td>A</td>
            </tr>

            <tr>
                <td>Intermediate</td>
                <td>XYZ College</td>
                <td>2022</td>
                <td>A</td>
            </tr>

            <tr>
                <td>Bachelor</td>
                <td>University Name</td>
                <td>2026</td>
                <td>B+</td>
            </tr>

        </table>


        <h2>Skills Selection</h2>

        <input type="checkbox" id="html" name="skills">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills">
        <label for="css">CSS</label>

        <input type="checkbox" id="js" name="skills">
        <label for="js">JavaScript</label>

        <input type="checkbox" id="python" name="skills">
        <label for="python">Python</label>


        <h2>Additional Information</h2>

        <p>
            <label for="cv">Upload CV:</label>
            <input type="file" id="cv" name="cv">
        </p>

        <p>
            <label for="date">Preferred Interview Date:</label>
            <input type="date" id="date" name="date">
        </p>


        <p>
            <label for="cover">Cover Letter:</label><br>
            <textarea id="cover" rows="6" cols="50"
            placeholder="Write your cover letter here..."></textarea>
        </p>


        <input type="submit" value="Apply Now">
        <input type="reset" value="Reset">


    </form>


    <h2>Company Introduction Video</h2>

    <iframe width="560" height="315"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    title="Company Introduction Video"
    frameborder="0"
    allowfullscreen>
    </iframe>


</body>
</html>
