<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tables and Forms</title>
</head>
<body>
   <form>
    <h1 style="background-color: blue;">Forms, Tables </h1>
    <label for="name">Name:</label>
    <input type="text" placeholder="Enter your name" id="name" name="name"><br><br>
    <label for="email">Email:</label>
    <input type="email" placeholder="Enter your email" id="email" name="email"><br><br>
    <label for="phone">Phone number:</label>
    <input type="tel" placeholder="Enter your phone number" id="phone" name="phone"><br><br>
    <label for="password">Password:</label>
    <input type="password" placeholder="Enter your password" id="password" name="password"><br><br>
    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="female"><br><br>
    <label for="country">Country:</label>
    <select id="country" >
        <option value="Pk">Pakistan</option>
        <option value="us">US</option>
        <option value="uk">UK</option> </select><br><br>
    <button type="submit">Submit</button>
    </form>
    <hr>
    <table border="1">
       <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Phone</th>
            <th>Country</th>
            <th>Gender</th> </tr>
             </thead>
            <tr>
              <tbody>

                <td>Azeesha Naveed</td>
                <td>20</td>
                <td>03251675637</td>
                <td>Pakistan</td>
                <td>Female</td>
            </tr>
            <tr>
                <td>Eman Naveed</td>
                <td>12</td>
                <td>03251675637</td>
                <td>Pakistan</td>
                <td>Female</td>
            </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">No of Employees</td>
                    <td>2</td>
                </tr>
            </tfoot>
        </table>
</html>
</body>
